name: publish

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'      # 0.1.4 / 1.1.1
      - 'v[0-9]*.[0-9]*.[0-9]*'      # v0.1.4 / v1.1.1

permissions:
  contents: read
  id-token: write   # npm 可信发布 (OIDC) + provenance 需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # 硬校验：tag（去掉可选的 v 前缀）必须与 package.json 版本号一致
      - name: 校验 tag 与版本号
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RAW_TAG="$TAG"
          TAG="${TAG#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag=$RAW_TAG 与 package.json version=$VER 不一致，拒绝发布"
            exit 1
          fi
          echo "✓ tag=$RAW_TAG → version=$VER 一致"

      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
